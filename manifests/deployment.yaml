apiVersion: apps/v1
kind: Deployment
metadata:
  name: lldap-controller
  labels:
    app: lldap-controller
    app.kubernetes.io/name: lldap-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lldap-controller
  template:
    metadata:
      labels:
        app: lldap-controller
      annotations:
        kubectl.kubernetes.io/default-container: lldap-controller
    spec:
      serviceAccountName: lldap-controller
      securityContext: {}
      containers:
        - name: lldap-controller
          image: '{{ index .images "lldap-controller" }}'
          imagePullPolicy: IfNotPresent
          securityContext: {}
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 100Mi
          volumeMounts:
            - name: credentials
              readOnly: true
              mountPath: "/secrets/credentials"
          env:
            - name: RUST_LOG
              value: info,lldap_controller=debug
            - name: LLDAP_URL
              value: "http://lldap:17170"
            - name: LLDAP_USERNAME
              value: admin
            - name: LLDAP_PASSWORD_FILE
              value: /secrets/credentials/lldap-ldap-user-pass
            - name: LLDAP_BIND_DN
              value: uid={username},ou=people,dc=huizinga,dc=dev
      volumes:
        - name: credentials
          secret:
            secretName: lldap-credentials
